<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - University Library</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-brand">🏛️ Admin Portal</div>
        <ul class="sidebar-menu">
          <li>
            <a href="#" class="active" onclick="Admin.navigate('overview')"
              >Dashboard</a
            >
          </li>
          <li>
            <a href="#" onclick="Admin.navigate('books')">Manage Books</a>
          </li>
          <li>
            <a href="#" onclick="Admin.navigate('students')">Manage Students</a>
          </li>
          <li><a href="#" onclick="Admin.navigate('issue')">Issue Book</a></li>
          <li>
            <a href="#" onclick="Admin.navigate('return')">Return Book</a>
          </li>
          <li>
            <a href="#" onclick="Admin.navigate('fines')">Fine Management</a>
          </li>
          <li><a href="#" onclick="Admin.navigate('settings')">Settings</a></li>
          <li><a href="#" onclick="Admin.logout()">Logout</a></li>
        </ul>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h2>Administrator Console</h2>
          <span id="adminGreeting">Welcome, Admin</span>
        </header>

        <section class="content-body" id="dynamicContent">
          <!-- Injected via js/admin.js -->
        </section>
      </main>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
