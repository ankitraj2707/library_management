<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Library Management System - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="glass-card">
        <div class="auth-header">
          <div class="logo-badge">🏛️</div>
          <h1>University Library</h1>
          <p>Your Gateway to Knowledge</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">University Email</label>
            <div class="input-container">
              <input
                type="email"
                id="email"
                required
                placeholder="admin@university.edu"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-container">
              <input
                type="password"
                id="password"
                required
                placeholder="••••••••"
              />
              <button type="button" class="pwd-toggle" id="pwdToggle">
                Show
              </button>
            </div>
          </div>
          <div class="form-options">
            <label><input type="checkbox" id="rememberMe" /> Remember me</label>
            <a
              href="#"
              style="color: var(--accent-cyan); text-decoration: none"
              onclick="
                alert(
                  'Contact the central library admin to reset your credentials.',
                )
              "
              >Forgot Password?</a
            >
          </div>
          <button type="submit" class="btn-submit" id="loginBtn">
            <span>Sign In</span>
          </button>
        </form>
      </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
